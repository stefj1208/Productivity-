name: Construire l'APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compiler l'application
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK (à télécharger dans l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: NotreSemaine-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Une adresse stable, sans connexion GitHub : l'APK de chaque branche est
      # aussi publié comme « release », remplacé à chaque construction.
      # https://github.com/stefj1208/Productivity-/releases/download/apk-<branche>/NotreSemaine.apk
      - name: Nommer l'APK et la release
        id: meta
        run: |
          tag="apk-$(echo "${GITHUB_REF_NAME}" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk NotreSemaine.apk

      - name: Publier l'APK à une adresse fixe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "APK · ${{ github.ref_name }}"
          body: "Dernière construction de la branche ${{ github.ref_name }} (${{ github.sha }}). Installez NotreSemaine.apk par-dessus la version précédente."
          prerelease: true
          files: NotreSemaine.apk
